name: Streamlit CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "catalog_app/**"
  push:
    branches:
      - main
    paths:
      - "catalog_app/**"

permissions:
  contents: read

concurrency:
  group: streamlit-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Streamlit app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit

      - name: Validate Python syntax
        run: python -m compileall catalog_app

      - name: Validate imports
        env:
          PYTHONPATH: catalog_app
        run: |
          python -c "import streamlit_app; import components.header; import components.object_summary; import components.column_table; import components.status_cards; import services.catalog_service; import services.mock_catalog_service"

      - name: Run lightweight tests if present
        run: |
          if [ -d catalog_app/tests ] || find catalog_app -maxdepth 2 -name "test_*.py" | grep -q .; then
            pip install pytest
            pytest catalog_app
          else
            echo "No catalog_app tests found; skipping pytest."
          fi

  deploy:
    name: Deploy Streamlit app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      PYTHON_VERSION: "3.11"
      STREAMLIT_ENTITY: avida_data_catalog
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: CATALOG_APP_ROLE
      SNOWFLAKE_WAREHOUSE: WH_GOVERNANCE_XS
      SNOWFLAKE_DATABASE: GOVERNANCE
      SNOWFLAKE_SCHEMA: CATALOG
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub Actions configuration
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          missing=0

          require_variable() {
            if [ -z "$2" ]; then
              echo "::error title=Missing GitHub variable::$1 is not configured in Settings > Secrets and variables > Actions > Variables."
              missing=1
            else
              echo "GitHub variable $1 configured: yes"
            fi
          }

          require_secret() {
            if [ -z "$2" ]; then
              echo "::error title=Missing GitHub secret::$1 is not configured in Settings > Secrets and variables > Actions > Secrets."
              missing=1
            else
              echo "GitHub secret $1 configured: yes"
            fi
          }

          require_variable "SNOWFLAKE_ACCOUNT" "${SNOWFLAKE_ACCOUNT}"
          require_secret "SNOWFLAKE_USER" "${SNOWFLAKE_USER}"
          require_secret "SNOWFLAKE_PRIVATE_KEY" "${SNOWFLAKE_PRIVATE_KEY}"

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Snowflake CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          mkdir -p "${RUNNER_TEMP}/pipx-bin"
          export PIPX_HOME="${RUNNER_TEMP}/pipx"
          export PIPX_BIN_DIR="${RUNNER_TEMP}/pipx-bin"
          python -m pipx install snowflake-cli==3.27.0
          echo "${PIPX_BIN_DIR}" >> "${GITHUB_PATH}"
          export PATH="${PIPX_BIN_DIR}:${PATH}"
          snow --version

      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: |
          mkdir -p "${RUNNER_TEMP}/snowflake"
          printf '%s\n' "${SNOWFLAKE_PRIVATE_KEY}" > "${RUNNER_TEMP}/snowflake/snowflake_key.p8"
          chmod 600 "${RUNNER_TEMP}/snowflake/snowflake_key.p8"

          echo "SNOWFLAKE_PRIVATE_KEY_FILE=${RUNNER_TEMP}/snowflake/snowflake_key.p8" >> "${GITHUB_ENV}"

          if [ -n "${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}" ]; then
            echo "PRIVATE_KEY_PASSPHRASE=${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE}" >> "${GITHUB_ENV}"
          fi

      - name: Print deployment configuration
        run: |
          echo "GitHub ref: ${GITHUB_REF}"
          echo "GitHub SHA: ${GITHUB_SHA}"
          echo "Streamlit entity: ${STREAMLIT_ENTITY}"
          echo "Snowflake account: ${SNOWFLAKE_ACCOUNT}"
          echo "Snowflake user secret configured: yes"
          echo "Snowflake role: ${SNOWFLAKE_ROLE}"
          echo "Snowflake warehouse: ${SNOWFLAKE_WAREHOUSE}"
          echo "Snowflake database: ${SNOWFLAKE_DATABASE}"
          echo "Snowflake schema: ${SNOWFLAKE_SCHEMA}"
          echo "Snowflake private key file configured: yes"

          if [ -n "${PRIVATE_KEY_PASSPHRASE:-}" ]; then
            echo "Snowflake private key passphrase configured: yes"
          else
            echo "Snowflake private key passphrase configured: no"
          fi

      - name: Verify Snowflake connection
        run: |
          snow sql \
            --temporary-connection \
            --account "${SNOWFLAKE_ACCOUNT}" \
            --user "${SNOWFLAKE_USER}" \
            --authenticator "${SNOWFLAKE_AUTHENTICATOR}" \
            --private-key-file "${SNOWFLAKE_PRIVATE_KEY_FILE}" \
            --role "${SNOWFLAKE_ROLE}" \
            --warehouse "${SNOWFLAKE_WAREHOUSE}" \
            --database "${SNOWFLAKE_DATABASE}" \
            --schema "${SNOWFLAKE_SCHEMA}" \
            -q "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_DATABASE(), CURRENT_SCHEMA(), CURRENT_WAREHOUSE();"

      - name: Deploy Streamlit app
        working-directory: catalog_app
        run: |
          snow streamlit deploy "${STREAMLIT_ENTITY}" \
            --replace \
            --temporary-connection \
            --account "${SNOWFLAKE_ACCOUNT}" \
            --user "${SNOWFLAKE_USER}" \
            --authenticator "${SNOWFLAKE_AUTHENTICATOR}" \
            --private-key-file "${SNOWFLAKE_PRIVATE_KEY_FILE}" \
            --database "${SNOWFLAKE_DATABASE}" \
            --schema "${SNOWFLAKE_SCHEMA}" \
            --role "${SNOWFLAKE_ROLE}" \
            --warehouse "${SNOWFLAKE_WAREHOUSE}"

      - name: Verify Streamlit deployment
        run: |
          snow sql \
            --temporary-connection \
            --account "${SNOWFLAKE_ACCOUNT}" \
            --user "${SNOWFLAKE_USER}" \
            --authenticator "${SNOWFLAKE_AUTHENTICATOR}" \
            --private-key-file "${SNOWFLAKE_PRIVATE_KEY_FILE}" \
            --role "${SNOWFLAKE_ROLE}" \
            --warehouse "${SNOWFLAKE_WAREHOUSE}" \
            --database "${SNOWFLAKE_DATABASE}" \
            --schema "${SNOWFLAKE_SCHEMA}" \
            -q "SHOW STREAMLITS LIKE 'AVIDIA_DATA_CATALOG' IN SCHEMA GOVERNANCE.CATALOG;"
